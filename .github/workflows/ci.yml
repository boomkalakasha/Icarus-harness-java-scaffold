name: Build and verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# This workflow is intentionally safe for pull requests opened from forks.
# It checks out and executes untrusted code with read-only permissions and no
# repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    name: Build, sample and public-content scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the Maven reactor and run tests
        run: mvn -B -ntp -Dstyle.color=never clean verify

      - name: Test verification-script safety guards
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate and build a sample project
        run: python scripts/generate-sample.py --root . --output-dir .ci/generated-sample

      - name: Scan source and generated material for public-content risks
        run: python scripts/verify-public-content.py --root . --include-generated --history
